# Overlay for SQL Pipeline Studio.
# Usage (from /root/mk-projects/datawarehouse):
#   docker compose -f docker-compose.yml -f docker-compose.studio.yml up -d
#
# This file MUST NOT remove, rename, or replace existing warehouse/Airflow
# volumes or networks. Volume lists on extended services are restated in full
# because Compose replaces sequence fields instead of appending them.

name: datawarehouse

x-studio-env: &studio-env
  STUDIO_SECRET_KEY: ${STUDIO_SECRET_KEY}
  STUDIO_ADMIN_EMAIL: ${STUDIO_ADMIN_EMAIL:-admin@localhost}
  STUDIO_ADMIN_PASSWORD: ${STUDIO_ADMIN_PASSWORD}
  STUDIO_DATABASE_URL: postgresql+psycopg://${STUDIO_DB_USER:-studio_app}:${STUDIO_DB_PASSWORD}@warehouse-db:5432/${STUDIO_DB:-pipeline_studio}
  LUDO_DB_NAME: ${LUDO_DB_NAME}
  LUDO_ETL_PASSWORD: ${LUDO_ETL_PASSWORD}
  WAREHOUSE_DB: ${WAREHOUSE_DB}
  WAREHOUSE_USER: ${WAREHOUSE_USER}
  WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD}
  AIRFLOW_API_BASE_URL: http://airflow-webserver:8080/api/v1
  AIRFLOW_API_USERNAME: ${AIRFLOW_STUDIO_API_USER:-studio_api}
  AIRFLOW_API_PASSWORD: ${AIRFLOW_STUDIO_API_PASSWORD}
  MANAGED_JOBS_DIR: /opt/airflow/managed-jobs
  STUDIO_PREVIEW_MAX_ROWS: ${STUDIO_PREVIEW_MAX_ROWS:-100}
  STUDIO_PREVIEW_TIMEOUT_SECONDS: ${STUDIO_PREVIEW_TIMEOUT_SECONDS:-15}

services:
  airflow-webserver:
    environment:
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./config:/opt/airflow/config
      - ./plugins:/opt/airflow/plugins
      - ./managed-jobs:/opt/airflow/managed-jobs:ro

  airflow-scheduler:
    environment:
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./config:/opt/airflow/config
      - ./plugins:/opt/airflow/plugins
      - ./managed-jobs:/opt/airflow/managed-jobs:ro

  studio-api:
    build:
      context: ./job-studio/backend
      dockerfile: Dockerfile
    image: pipeline-studio-api:1.0.0
    restart: unless-stopped
    environment:
      <<: *studio-env
    volumes:
      - ./managed-jobs:/opt/airflow/managed-jobs
    networks:
      - internal
      - analytics-net
    depends_on:
      warehouse-db:
        condition: service_healthy
      airflow-webserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/system/health', timeout=5)"]
      interval: 20s
      timeout: 8s
      retries: 8
      start_period: 25s

  studio-reconciler:
    build:
      context: ./job-studio/backend
      dockerfile: Dockerfile
    image: pipeline-studio-api:1.0.0
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *studio-env
    volumes:
      - ./managed-jobs:/opt/airflow/managed-jobs
    networks:
      - internal
      - analytics-net
    depends_on:
      studio-api:
        condition: service_healthy

  studio-web:
    build:
      context: ./job-studio/frontend
      dockerfile: Dockerfile
    image: pipeline-studio-web:1.0.0
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://studio-api:8000
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1:8096:3000"
    networks:
      - internal
    depends_on:
      studio-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 8s
      retries: 8
      start_period: 15s
